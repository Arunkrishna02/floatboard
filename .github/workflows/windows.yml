name: Windows build
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish portable executable
        run: dotnet publish Floatboard.csproj -c Release -r win-${{ matrix.arch }} --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Floatboard-Windows-${{ matrix.arch }}
          path: |
            publish/Floatboard.exe
            README.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Floatboard-Windows-*
          path: artifacts
      - name: Package Windows downloads
        run: |
          for arch in x64 arm64; do
            artifact="artifacts/Floatboard-Windows-$arch"
            test -s "$artifact/publish/Floatboard.exe"
            test -s "$artifact/README.md"
            zip -j "Floatboard-Windows-$arch.zip" "$artifact/publish/Floatboard.exe" "$artifact/README.md"
            unzip -t "Floatboard-Windows-$arch.zip"
          done
      - name: Publish preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" Floatboard-Windows-x64.zip Floatboard-Windows-arm64.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "Floatboard $GITHUB_REF_NAME Preview" \
            --notes "Download the x64 ZIP for most Intel and AMD laptops or the ARM64 ZIP for Windows on Arm. Extract it and run Floatboard.exe. The runtime is included. This preview is unsigned."
